name: Vigie — run hebdomadaire

on:
  schedule:
    # lundi 10:00 UTC = 06:00 AST (Martinique, UTC-4, pas de changement d'heure)
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# deux runs ne doivent jamais écrire le corpus en même temps : le second
# perdrait son push, donc une semaine de collecte
concurrency:
  group: vigie-corpus
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # deploy-pages exige un environnement déclaré, sinon l'étape échoue
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collecte et rendu
        id: rendu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
        run: python run.py --cadence weekly

      # Un digest non envoye ne doit pas empecher la publication du radar.
      # L'etape refusait l'envoi (DKIM et DMARC pas encore publies) et rendait
      # la main avec le code 1 : tout ce qui suit, dont le site, etait saute
      # alors que la collecte et le rendu avaient reussi. Elle signale
      # desormais son echec sans arreter le run.
      # Par defaut le message est ecrit en .eml au lieu d'etre expedie. Pour
      # passer a l'envoi reel : creer la variable VIGIE_SIMULATE_DELIVERY = 0
      # une fois DKIM et DMARC publies et les secrets SMTP renseignes.
      - name: Envoi du digest
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DKIM_SELECTOR: ${{ secrets.DKIM_SELECTOR }}
          VIGIE_SIMULATE_DELIVERY: ${{ vars.VIGIE_SIMULATE_DELIVERY || '1' }}
        run: python run.py --send

      - name: Commit du corpus et des relevés
        run: |
          # Une relance ("Re-run jobs") rejoue un ancien commit : git s'y trouve
          # sur une tete detachee, et pousser depuis la echoue. Le run entier
          # tombait alors qu'il avait deja collecte et produit ses fichiers.
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "HEAD" ]; then
            echo "relance d'un run passe : le corpus n'est pas reecrit"
            exit 0
          fi
          git config user.name "vigie-bot"
          git config user.email "vigie-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "corpus: run du $(date -u +%F)"
          git pull --rebase --autostash
          git push

      # Le radar est toujours recuperable depuis l'onglet Actions, en piece
      # jointe du run. La publication Pages, elle, est optionnelle : sur un
      # plan gratuit, un depot PRIVE ne peut pas publier de site, et un site
      # publie est de toute facon public. Tant que la variable PUBLISH_PAGES
      # ne vaut pas 1, le depot reste prive et rien n'est expose.
      # La piece jointe et le site ne dependent que du rendu : ni l'envoi du
      # digest ni le commit du corpus ne doivent les empecher.
      - name: Radar et digest en piece jointe du run
        if: steps.rendu.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: vigie-${{ github.run_number }}
          path: out/
          retention-days: 90

      - uses: actions/configure-pages@v6
        id: pages
        if: steps.rendu.conclusion == 'success' && vars.PUBLISH_PAGES == '1'
      - uses: actions/upload-pages-artifact@v5
        if: steps.rendu.conclusion == 'success' && vars.PUBLISH_PAGES == '1'
        with:
          path: out/
      - uses: actions/deploy-pages@v5
        if: steps.rendu.conclusion == 'success' && vars.PUBLISH_PAGES == '1'

      # Dernier, volontairement : on publie ce qu'on a, puis le run passe au
      # rouge si la qualite s'est effondree. Un run vert pendant que 100 % des
      # resumes echouent est pire qu'un run rouge.
      - name: Controle de qualite
        if: steps.rendu.conclusion == 'success'
        run: python run.py --verifier 
