name: Vigie — alertes quotidiennes

on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 AST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigie-corpus
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collecte des alertes
        env:
          # sans cette clé, les alertes partaient sans résumé : le run
          # hebdomadaire l'avait, le quotidien non
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --cadence daily
      - name: Commit des alertes
        run: |
          git config user.name "vigie-bot"
          git config user.email "vigie-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "alertes: $(date -u +%F)"
          git pull --rebase --autostash
          git push
